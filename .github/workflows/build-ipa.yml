name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build CloudPhotos IPA
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          cd ios-photo-app
          npm install

      - name: Build Web Application
        run: |
          cd ios-photo-app
          npm run build

      - name: Sync with Capacitor iOS
        run: |
          cd ios-photo-app
          npx cap sync ios
          node -e '
            const fs = require("fs");
            const file = "ios/App/App/capacitor.config.json";
            if (fs.existsSync(file)) {
              const cfg = JSON.parse(fs.readFileSync(file, "utf8"));
              cfg.packageClassList = cfg.packageClassList || [];
              if (!cfg.packageClassList.includes("PhotoSync")) cfg.packageClassList.push("PhotoSync");
              if (!cfg.packageClassList.includes("PhotoSyncPlugin")) cfg.packageClassList.push("PhotoSyncPlugin");
              fs.writeFileSync(file, JSON.stringify(cfg, null, 2));
              console.log("Injected PhotoSync into packageClassList:", cfg.packageClassList);
            }
          '

      - name: Build iOS App with Xcode
        run: |
          cd ios-photo-app/ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into .ipa
        run: |
          cd ios-photo-app/ios/App
          mkdir -p Payload
          cp -r derived_data/Build/Products/Release-iphoneos/App.app Payload/App.app
          cp App/Assets.xcassets/AppIcon.appiconset/*.png Payload/App.app/ || true
          cp App/AppIcon*.png Payload/App.app/ || true
          cp App/iTunesArtwork*.png Payload/App.app/ || true
          zip -qr CloudPhotos.ipa Payload
          echo "=== IPA File Created ==="
          ls -lh CloudPhotos.ipa

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CloudPhotos.ipa
          path: ios-photo-app/ios/App/CloudPhotos.ipa
          if-no-files-found: error

      - name: Publish Latest IPA Release for Direct Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: latest
          name: "CloudPhotos Latest Build"
          body: |
            🚀 **Bản dựng CloudPhotos IPA mới nhất tự động từ CI/CD**
            - Tải trực tiếp file `.ipa` bên dưới để cài đặt qua TrollStore / Sideloadly / AltStore.
          files: ios-photo-app/ios/App/CloudPhotos.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
